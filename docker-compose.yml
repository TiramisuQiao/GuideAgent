version: '3.8'

services:
  mita-sales-agent:
    build: .
    container_name: mita-sales-agent
    ports:
      - "8501:8501"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./logs:/app/logs
    environment:
      - TZ=Asia/Shanghai
